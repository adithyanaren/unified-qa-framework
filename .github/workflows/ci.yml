name: CI - Unified QA Framework (CRUD + ML)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  QA_MODE: "adaptive"
  AWS_REGION: "us-east-1"

  # Prometheus & Pushgateway
  PUSHGATEWAY_URL: "http://54.224.224.239:9091"
  PROMETHEUS_URL: "http://54.224.224.239:9090"

  # Lambda Names
  ML_LAMBDA_NAME: "QAFrameworkMLInferenceContainer"
  CRUD_LAMBDA_NAME: "QAFrameworkCRUD"

  # API Endpoints
  ML_API_URL: "https://tyoladeyr9.execute-api.us-east-1.amazonaws.com/dev"
  CRUD_API_URL: "https://hp0emdwj90.execute-api.us-east-1.amazonaws.com/dev"

  AWS_ACCOUNT_ID: "976193248434"
  ECR_URI: "976193248434.dkr.ecr.us-east-1.amazonaws.com/qa-ml-inference"


jobs:
  qa-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    # -------------------------------------
    # SETUP
    # -------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure jq is available
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}


    # -------------------------------------
    # 🔥 UNIVERSAL ML WARM-UP (CALLS /predict)
    # -------------------------------------
    - name: Warm-Up ML Lambda (Global Start)
      run: |
        echo "Warming ML Lambda..."
        for i in {1..5}; do
          curl -s -o /dev/null -w "ML warm-up $i: %{time_total}\n" \
          -X POST "${{ env.ML_API_URL }}/predict" \
          -H "Content-Type: application/json" \
          -d '{"Chest_Pain":0,"Shortness_of_Breath":0,"Fatigue":0,"Palpitations":0,
               "Dizziness":0,"Swelling":0,"Pain_Arms_Jaw_Back":0,"Cold_Sweats_Nausea":0,
               "High_BP":0,"High_Cholesterol":0,"Diabetes":0,"Smoking":0,"Obesity":0,
               "Sedentary_Lifestyle":0,"Family_History":0,"Chronic_Stress":0,
               "Gender":1,"Age":50}'
        done


    # -------------------------------------
    # PYTEST (ML)
    # -------------------------------------
    - name: Warm-Up Before ML PyTest
      run: |
        echo "Warming ML before PyTest..."
        for i in {1..5}; do
          curl -s -o /dev/null -w "ML warm-up pytest $i: %{time_total}\n" \
          -X POST "${{ env.ML_API_URL }}/predict" \
          -H "Content-Type: application/json" \
          -d '{"Chest_Pain":0,"Shortness_of_Breath":0,"Fatigue":0,"Palpitations":0,
               "Dizziness":0,"Swelling":0,"Pain_Arms_Jaw_Back":0,"Cold_Sweats_Nausea":0,
               "High_BP":0,"High_Cholesterol":0,"Diabetes":0,"Smoking":0,"Obesity":0,
               "Sedentary_Lifestyle":0,"Family_History":0,"Chronic_Stress":0,
               "Gender":1,"Age":50}'
        done

    - name: Run PyTest (ML Tests)
      continue-on-error: true
      run: |
        mkdir -p reports/ml_pytest
        pytest src/tests/ml \
               src/tests/pytest/test_ml_api_functional.py \
               -v --disable-warnings \
               --junitxml=reports/ml_pytest/results.xml


    # -------------------------------------
    # PYTEST (CRUD)
    # -------------------------------------
    - name: Run PyTest (CRUD Tests)
      continue-on-error: true
      run: |
        mkdir -p reports/crud_pytest
        pytest src/tests/pytest/test_api.py \
               -v --disable-warnings \
               --junitxml=reports/crud_pytest/results.xml


    # -------------------------------------
    # ROBOT (ML)
    # -------------------------------------
    - name: Warm-Up Before ML Robot Tests
      run: |
        echo "Warming ML before Robot..."
        for i in {1..5}; do
          curl -s -o /dev/null -w "ML warm-up robot $i: %{time_total}\n" \
          -X POST "${{ env.ML_API_URL }}/predict" \
          -H "Content-Type: application/json" \
          -d '{"Chest_Pain":0,"Shortness_of_Breath":0,"Fatigue":0,"Palpitations":0,
               "Dizziness":0,"Swelling":0,"Pain_Arms_Jaw_Back":0,"Cold_Sweats_Nausea":0,
               "High_BP":0,"High_Cholesterol":0,"Diabetes":0,"Smoking":0,"Obesity":0,
               "Sedentary_Lifestyle":0,"Family_History":0,"Chronic_Stress":0,
               "Gender":1,"Age":50}'
        done

    - name: Run Robot Framework (ML Inference)
      continue-on-error: true
      run: |
        mkdir -p reports/robot_ml
        robot -d reports/robot_ml src/tests/Robot/ml_inference_tests.robot


    # -------------------------------------
    # ROBOT (CRUD)
    # -------------------------------------
    - name: Run Robot Framework (CRUD API)
      continue-on-error: true
      run: |
        mkdir -p reports/robot_crud
        robot -d reports/robot_crud src/tests/Robot/api_tests.robot


    # -------------------------------------
    # LOCUST ML
    # -------------------------------------
    - name: Warm-Up Before Locust ML
      run: |
        echo "Warming ML before Locust..."
        for i in {1..5}; do
          curl -s -o /dev/null -w "ML warm-up locust $i: %{time_total}\n" \
          -X POST "${{ env.ML_API_URL }}/predict" \
          -H "Content-Type: application/json" \
          -d '{"Chest_Pain":0,"Shortness_of_Breath":0,"Fatigue":0,"Palpitations":0,
               "Dizziness":0,"Swelling":0,"Pain_Arms_Jaw_Back":0,"Cold_Sweats_Nausea":0,
               "High_BP":0,"High_Cholesterol":0,"Diabetes":0,"Smoking":0,"Obesity":0,
               "Sedentary_Lifestyle":0,"Family_History":0,"Chronic_Stress":0,
               "Gender":1,"Age":50}'
        done

    - name: Run Locust ML Load Test
      continue-on-error: true
      run: |
        mkdir -p reports/locust_ml
        echo "Running ML Locust tests..."
        locust -f src/tests/locust/locust_ml_inference.py \
          --headless -u 25 -r 5 -t 2m \
          --host ${{ env.ML_API_URL }} \
          --csv reports/locust_ml/results \
          --only-summary || true


    # -------------------------------------
    # LOCUST CRUD
    # -------------------------------------
    - name: Run Locust CRUD Load Test
      continue-on-error: true
      run: |
        mkdir -p reports/locust_crud
        echo "Running CRUD Locust tests..."
        locust -f src/tests/locust/locustfile.py \
          --headless -u 25 -r 5 -t 2m \
          --host ${{ env.CRUD_API_URL }} \
          --csv reports/locust_crud/results \
          --only-summary || true


    # -------------------------------------
    # CLOUDWATCH → PROMETHEUS (ML)
    # -------------------------------------
    - name: Push ML Lambda Metrics (CloudWatch → Prometheus)
      continue-on-error: true
      run: |
        echo "Fetching ML metrics…"

        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkML" \
          --metric-name InferenceCount \
          --dimensions Name=FunctionName,Value=$ML_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Sum > ml_inference.json

        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkML" \
          --metric-name InferenceLatency \
          --dimensions Name=FunctionName,Value=$ML_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Average > ml_latency.json

        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkML" \
          --metric-name ModelColdStartCount \
          --dimensions Name=FunctionName,Value=$ML_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Sum > ml_cold.json

        INF=$(jq '[.Datapoints[].Sum] | add // 0' ml_inference.json)
        LAT=$(jq '[.Datapoints[].Average] | add // 0' ml_latency.json)
        COLD=$(jq '[.Datapoints[].Sum] | add // 0' ml_cold.json)

        echo "ml_inference_count $INF" > ml_metrics.prom
        echo "ml_inference_latency_ms $LAT" >> ml_metrics.prom
        echo "ml_model_cold_start_count $COLD" >> ml_metrics.prom

        curl --data-binary "@ml_metrics.prom" \
          ${{ env.PUSHGATEWAY_URL }}/metrics/job/ml_lambda/instance/github-actions || true


    # -------------------------------------
    # CLOUDWATCH → PROMETHEUS (CRUD)
    # -------------------------------------
    - name: Push CRUD Lambda Metrics (CloudWatch → Prometheus)
      continue-on-error: true
      run: |
        echo "Fetching CRUD metrics…"

        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkMetrics" \
          --metric-name RequestsProcessed \
          --dimensions Name=FunctionName,Value=$CRUD_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Sum > crud_requests.json

        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkMetrics" \
          --metric-name ColdStartCount \
          --dimensions Name=FunctionName,Value=$CRUD_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Sum > crud_cold.json

        REQ=$(jq '[.Datapoints[].Sum] | add // 0' crud_requests.json)
        COLD=$(jq '[.Datapoints[].Sum] | add // 0' crud_cold.json)

        echo "crud_requests_processed $REQ" > crud_metrics.prom
        echo "crud_cold_start_count $COLD" >> crud_metrics.prom

        curl --data-binary "@crud_metrics.prom" \
          ${{ env.PUSHGATEWAY_URL }}/metrics/job/crud_lambda/instance/github-actions || true


    # -------------------------------------
    # ADAPTIVE CONTROLLER (ML + CRUD)
    # -------------------------------------
    - name: Adaptive QA (ML Lambda)
      continue-on-error: true
      run: |
        python adaptive_controller.py

    - name: Adaptive QA (CRUD Lambda)
      continue-on-error: true
      run: |
        python adaptive_controller.py


    # -------------------------------------
    # PROMOTE ML
    # -------------------------------------
    - name: Promote ML Lambda to live
      continue-on-error: true
      run: |
        VERSION=$(aws lambda publish-version --function-name $ML_LAMBDA_NAME --query Version --output text)
        aws lambda update-alias --function-name $ML_LAMBDA_NAME --name live --function-version $VERSION

    # -------------------------------------
    # PROMOTE CRUD
    # -------------------------------------
    - name: Promote CRUD Lambda to live
      continue-on-error: true
      run: |
        VERSION=$(aws lambda publish-version --function-name $CRUD_LAMBDA_NAME --query Version --output text)
        aws lambda update-alias --function-name $CRUD_LAMBDA_NAME --name live --function-version $VERSION


    # -------------------------------------
    # GRAFANA DASHBOARD
    # -------------------------------------
    - name: Update Unified Grafana Dashboard
      continue-on-error: true
      run: |
        python generate_dashboard.py --refresh --stage dev

    # -------------------------------------
    # PUBLISH REPORTS
    # -------------------------------------
    - name: Deploy Reports to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: reports
