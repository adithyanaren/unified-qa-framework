name: CI - Unified QA Framework (ML Inference Lambda)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  QA_MODE: "adaptive"
  AWS_REGION: "us-east-1"
  PUSHGATEWAY_URL: "http://54.224.224.239:9091"
  PROMETHEUS_URL: "http://54.224.224.239:9090"
  ML_LAMBDA_NAME: "QAFrameworkMLInferenceContainer"

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    # -------------------------------------
    # CHECKOUT + PYTHON
    # -------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure jq is installed
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    # -------------------------------------
    # AWS CREDS
    # -------------------------------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # -------------------------------------
    # PYTEST
    # -------------------------------------
    - name: Run PyTest
      continue-on-error: true
      run: |
        mkdir -p reports/pytest
        pytest src/tests/ml src/tests/pytest -v --disable-warnings \
          --junitxml=reports/pytest/results.xml

    # -------------------------------------
    # ROBOT FRAMEWORK
    # -------------------------------------
    - name: Run Robot Framework tests
      continue-on-error: true
      run: |
        mkdir -p reports/robot
        robot --output reports/robot/output.xml \
              --report reports/robot/report.html \
              --log reports/robot/log.html \
              src/tests/Robot/ml_inference_tests.robot

    # -------------------------------------
    # LOCUST LOAD TEST
    # -------------------------------------
    - name: Run Locust ML Load Test
      continue-on-error: true
      run: |
        mkdir -p reports/locust

        locust -f src/tests/locust/locust_ml_inference.py \
          --headless -u 25 -r 5 -t 2m \
          --host https://tyoladeyr9.execute-api.us-east-1.amazonaws.com \
          --csv reports/locust/results --only-summary || true

        CSV="reports/locust/results_stats.csv"
        if [ -f "$CSV" ]; then
          REQUESTS=$(awk -F',' 'NR>1 {sum+=$2} END {print sum+0}' $CSV)
          FAILURES=$(awk -F',' 'NR>1 {sum+=$3} END {print sum+0}' $CSV)
          AVG_LAT=$(awk -F',' 'NR>1 {sum+=$5; n++} END {if(n>0) print sum/n; else print 0}' $CSV)

          echo "locust_requests_total $REQUESTS" > locust.prom
          echo "locust_failures_total $FAILURES" >> locust.prom
          echo "locust_avg_latency_ms $AVG_LAT" >> locust.prom

          # ---- Correct isolated job naming ----
          if [ "$QA_MODE" = "baseline" ]; then
            JOB="locust_baseline"
          else
            JOB="locust_adaptive"
          fi

          RUN=$(date +%s)
          curl --data-binary "@locust.prom" \
            "$PUSHGATEWAY_URL/metrics/job=$JOB/instance=github-actions/run_id=$RUN" || true
        fi

    # -------------------------------------
    # ML INFERENCE DIRECT TEST
    # -------------------------------------
    - name: Run ML Lambda Inference Test
      continue-on-error: true
      run: |
        mkdir -p reports/ml
        python src/tests/ml/test_ml_inference_lambda.py

    # -------------------------------------
    # FETCH CLOUDWATCH METRICS + PUSH TO PROMETHEUS
    # -------------------------------------
    - name: Fetch & Push ML CloudWatch Metrics
      run: |
        mkdir -p reports/cloudwatch
        sleep 30

        # Fetch metrics
        METRICS="InferenceCount InferenceLatency ModelColdStartCount"
        for M in $METRICS; do
          aws cloudwatch get-metric-statistics \
            --namespace "QAFrameworkMetrics" \
            --metric-name $M \
            --dimensions Name=FunctionName,Value=$ML_LAMBDA_NAME Name=Stage,Value=dev \
            --start-time $(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --period 60 \
            --statistics Average Sum \
            > reports/cloudwatch/${M}.json || true
        done

        INFER=$(jq '[.Datapoints[].Sum] | add // 0' reports/cloudwatch/InferenceCount.json)
        LAT=$(jq '[.Datapoints[].Average] | add // 0' reports/cloudwatch/InferenceLatency.json)
        COLD=$(jq '[.Datapoints[].Sum] | add // 0' reports/cloudwatch/ModelColdStartCount.json)

        echo "ml_inference_count $INFER" > ml.prom
        echo "ml_inference_latency_ms $LAT" >> ml.prom
        echo "ml_model_cold_start_count $COLD" >> ml.prom

        # ---- FIXED: SEPARATE BASELINE + ADAPTIVE ----
        if [ "$QA_MODE" = "baseline" ]; then
          JOB="ml_inference_baseline"
        else
          JOB="ml_inference_adaptive"
        fi

        RUN=$(date +%s)

        curl --data-binary "@ml.prom" \
          "$PUSHGATEWAY_URL/metrics/job=$JOB/instance=github-actions/run_id=$RUN" || true

    # -------------------------------------
    # ADAPTIVE CONTROLLER
    # -------------------------------------
    - name: Run Adaptive QA Controller
      continue-on-error: true
      run: |
        python adaptive_controller.py --lambda $ML_LAMBDA_NAME

    # -------------------------------------
    # UPDATE GRAFANA
    # -------------------------------------
    - name: Update Grafana Dashboard
      continue-on-error: true
      run: |
        python generate_dashboard.py --refresh --stage dev --function $ML_LAMBDA_NAME

    # -------------------------------------
    # PUBLISH REPORTS
    # -------------------------------------
    - name: Deploy Reports
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: reports
