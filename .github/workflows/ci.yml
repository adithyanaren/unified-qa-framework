name: CI - Unified QA Framework (ML Inference Lambda)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  QA_MODE: "adaptive"
  AWS_REGION: "us-east-1"
  PUSHGATEWAY_URL: "http://54.224.224.239:9091"
  PROMETHEUS_URL: "http://54.224.224.239:9090"
  ML_LAMBDA_NAME: "QAFrameworkMLInferenceContainer"

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest
    services:
      pushgateway:
        image: prom/pushgateway:latest
        ports:
          - 9091:9091

    steps:
    # --- Checkout and Setup ---
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Ensure jq is available
      run: |
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          sudo apt-get update
          sudo apt-get install -y jq
        else
          echo "jq already available"
        fi
    # --- Configure AWS Credentials ---
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # --- Create ngrok tunnel for Pushgateway (fallback) ---
    - name: Start ngrok tunnel (optional)
      run: |
        npm install -g ngrok
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        ngrok http 9091 --log=stdout > ngrok.log &
        sleep 5
        NGROK_URL=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV
        echo "🌐 Pushgateway Tunnel: $NGROK_URL"

    - name: Run PyTest
      run: |
        mkdir -p reports/pytest
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        echo "PYTHONPATH is $PYTHONPATH"
        pytest src/tests/ml --maxfail=1 --disable-warnings -q --junitxml=reports/pytest/results.xml


    - name: Run Robot Framework tests (ML Lambda)
      run: |
        mkdir -p reports/robot
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        echo "PYTHONPATH is $PYTHONPATH"
        robot --output reports/robot/output.xml \
              --report reports/robot/report.html \
              --log reports/robot/log.html \
              src/tests/Robot/ml_inference_tests.robot



    - name: Run Locust load tests
      run: |
        mkdir -p reports/locust
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        echo "PYTHONPATH is $PYTHONPATH"
        locust -f src/tests/locust/locustfile.py \
          --headless \
          -u 10 -r 2 -t 1m \
          --host https://tyoladeyr9.execute-api.us-east-1.amazonaws.com/dev \
          --csv reports/locust/results


    - name: Push Locust metrics to Pushgateway
      run: |
        LOCUST_CSV="reports/locust/results_stats.csv"
        REQUESTS=$(awk -F',' 'NR>1 {sum+=$2} END {print sum}' $LOCUST_CSV)
        FAILURES=$(awk -F',' 'NR>1 {sum+=$3} END {print sum}' $LOCUST_CSV)
        AVG_LATENCY=$(awk -F',' 'NR>1 {sum+=$5; count++} END {if(count>0) print sum/count; else print 0}' $LOCUST_CSV)
        echo "locust_requests_total $REQUESTS" > locust.prom
        echo "locust_failures_total $FAILURES" >> locust.prom
        echo "locust_avg_latency_ms $AVG_LATENCY" >> locust.prom
        curl --data-binary "@locust.prom" ${{ env.PUSHGATEWAY_URL }}/metrics/job/locust/instance/github-actions || true
        echo "✅ Locust metrics pushed to Prometheus"

    # --- Run ML Lambda Inference Test ---
    - name: Run ML Lambda Inference Test
      run: |
        mkdir -p reports/ml
        python src/tests/ml/test_ml_inference_lambda.py
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # --- Run ML Experiments ---
    - name: Run ML Experiment Suite
      run: |
        echo "=== Executing ML Experiment Suite ==="
        mkdir -p reports/ml_experiments
        python src/experiments/ml_latency_experiment.py
        python src/experiments/ml_coldstart_experiment.py
        python src/experiments/ml_concurrency_experiment.py
        python src/experiments/ml_adaptive_feedback_experiment.py
        echo "✅ All ML experiments executed"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # --- Deploy Lambda to Dev Alias ---
    - name: Deploy Lambda to dev alias
      run: |
        zip -r lambda_ml.zip lambda_ml_container/
        aws lambda update-function-code \
          --function-name $ML_LAMBDA_NAME \
          --zip-file fileb://lambda_ml.zip
        aws lambda wait function-updated --function-name $ML_LAMBDA_NAME
        VERSION=$(aws lambda publish-version --function-name $ML_LAMBDA_NAME --query Version --output text)
        aws lambda update-alias \
          --function-name $ML_LAMBDA_NAME \
          --name dev \
          --function-version $VERSION || \
        aws lambda create-alias \
          --function-name $ML_LAMBDA_NAME \
          --name dev \
          --function-version $VERSION
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    # --- Health Check Lambda ---
    - name: Health check Lambda alias
      run: |
        echo "Invoking $ML_LAMBDA_NAME:dev..."
        aws lambda invoke \
          --function-name $ML_LAMBDA_NAME:dev \
          --cli-binary-format raw-in-base64-out \
          --payload '{"ping":"test"}' response.json
        cat response.json

    # --- Force Cold Start ---
    - name: Force Cold Start
      run: |
        aws lambda update-function-configuration \
          --function-name $ML_LAMBDA_NAME \
          --environment "Variables={DUMMY=$(date +%s)}"
        aws lambda wait function-updated --function-name $ML_LAMBDA_NAME

# --- Fetch CloudWatch Metrics and Push to Prometheus ---
    - name: Fetch and Push CloudWatch Metrics
      run: |
        mkdir -p reports/cloudwatch
        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkMetrics" \
          --metric-name InferenceCount \
          --dimensions Name=FunctionName,Value=$ML_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Sum > reports/cloudwatch/inference.json
        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkMetrics" \
          --metric-name InferenceLatency \
          --dimensions Name=FunctionName,Value=$ML_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Average > reports/cloudwatch/latency.json
        aws cloudwatch get-metric-statistics \
          --namespace "QAFrameworkMetrics" \
          --metric-name ModelColdStartCount \
          --dimensions Name=FunctionName,Value=$ML_LAMBDA_NAME Name=Stage,Value=dev \
          --start-time $(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --period 60 --statistics Sum > reports/cloudwatch/cold.json
    
        INFER=$(jq '[.Datapoints[].Sum] | add // 0' reports/cloudwatch/inference.json)
        LATENCY=$(jq '[.Datapoints[].Average] | add // 0' reports/cloudwatch/latency.json)
        COLD=$(jq '[.Datapoints[].Sum] | add // 0' reports/cloudwatch/cold.json)
    
        echo "ml_inference_count $INFER" > ml_lambda.prom
        echo "ml_inference_latency_ms $LATENCY" >> ml_lambda.prom
        echo "ml_model_cold_start_count $COLD" >> ml_lambda.prom
    
        curl --data-binary "@ml_lambda.prom" ${{ env.PUSHGATEWAY_URL }}/metrics/job/ml_lambda/instance/github-actions || true
        echo "✅ ML CloudWatch metrics pushed to Prometheus"


    # --- Run Adaptive QA Controller ---
    - name: Run Adaptive QA Controller
      run: |
        python src/adaptive_controller.py --lambda $ML_LAMBDA_NAME
      env:
        PROMETHEUS_URL: ${{ env.PROMETHEUS_URL }}
        PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}

    # --- Promote to Live Alias ---
    - name: Promote to live alias
      if: success()
      run: |
        echo "Promoting version $VERSION to live..."
        aws lambda update-alias \
          --function-name $ML_LAMBDA_NAME \
          --name live \
          --function-version $VERSION || \
        aws lambda create-alias \
          --function-name $ML_LAMBDA_NAME \
          --name live \
          --function-version $VERSION

    # --- Update Unified Dashboard ---
    - name: Update Unified Grafana Dashboard
      run: |
        python generate_dashboard.py --refresh --stage dev --function $ML_LAMBDA_NAME

    # --- Publish Reports to GitHub Pages ---
    - name: Deploy reports to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: reports
