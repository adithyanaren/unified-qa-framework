region: us-east-1
metrics:
  - aws_namespace: AWS/Lambda
    aws_metric_name: Invocations
    aws_dimensions: [FunctionName]
    aws_dimension_select:
      FunctionName: [QAFrameworkCRUD]
    aws_statistics: [Sum]

  - aws_namespace: AWS/Lambda
    aws_metric_name: Errors
    aws_dimensions: [FunctionName]
    aws_dimension_select:
      FunctionName: [QAFrameworkCRUD]
    aws_statistics: [Sum]

  - aws_namespace: AWS/Lambda
    aws_metric_name: Duration
    aws_dimensions: [FunctionName]
    aws_dimension_select:
      FunctionName: [QAFrameworkCRUD]
    aws_statistics: [Average, Maximum]

  - aws_namespace: AWS/Lambda
    aws_metric_name: InitDuration
    aws_dimensions: [FunctionName]
    aws_dimension_select:
      FunctionName: [QAFrameworkCRUD]
    aws_statistics: [Average]

  - aws_namespace: QAFramework/Serverless
    aws_metric_name: RequestsProcessed
    aws_dimensions: [FunctionName, Stage]
    aws_dimension_select:
      FunctionName: [QAFrameworkCRUD]
      Stage: [dev]
    aws_statistics: [Sum]
    period: 60
    range_seconds: 600

  - aws_namespace: QAFramework/Serverless
    aws_metric_name: ColdStartCount
    aws_dimensions: [FunctionName, Stage]
    aws_dimension_select:
      FunctionName: [QAFrameworkCRUD]
      Stage: [dev]
    aws_statistics: [Sum]
    period: 60
    range_seconds: 600
